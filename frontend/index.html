<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Document Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        input,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        input {
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #2457c5;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #status {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Information Upload</h2>
        <p>Upload your student profile to the university system.</p>

        <form id="uploadForm">
            <label for="email">University Email</label>
            <input type="email" id="email" name="email" placeholder="yourname@rknec.edu" required>

            <label for="file">Select student document</label>
            <input type="file" id="file" name="file" accept=".pdf,.txt,.csv,.docx" required>

            <small>
                Supported formats: PDF, TXT, CSV and DOCX.
                Maximum size: 15 MB.
            </small>

            <button type="submit" id="submitBtn">Upload Document</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
    </div>

    <script>
        // Replace this with the CURRENT Elastic Beanstalk environment URL.
        const API_BASE_URL =
            "http://studentdatabasemanagement-env-1.eba-p3uy2ffq.us-east-1.elasticbeanstalk.com/api";

        const form = document.getElementById("uploadForm");
        const status = document.getElementById("status");
        const button = document.getElementById("submitBtn");
        const emailInput = document.getElementById("email");
        const fileInput = document.getElementById("file");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const file = fileInput.files[0];

            if (!/^[a-z0-9._%+-]+@rknec\.edu$/i.test(email)) {
                status.textContent =
                    "Error: Please use a valid @rknec.edu email address.";
                return;
            }

            if (!file) {
                status.textContent = "Error: Please select a document.";
                return;
            }

            const allowedExtensions = [".pdf", ".txt", ".csv", ".docx"];
            const filename = file.name.toLowerCase();
            const allowed = allowedExtensions.some(ext => filename.endsWith(ext));

            if (!allowed) {
                status.textContent =
                    "Error: Allowed formats are PDF, TXT, CSV and DOCX.";
                return;
            }

            if (file.size > 15 * 1024 * 1024) {
                status.textContent = "Error: Maximum file size is 15 MB.";
                return;
            }

            button.disabled = true;
            status.textContent = "Uploading document to AWS S3...";

            try {
                const formData = new FormData();
                formData.append("email", email);
                formData.append("file", file);

                const response = await fetch(
                    `${API_BASE_URL}/api/upload`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const responseText = await response.text();
                let result;

                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        `Backend returned a non-JSON response (HTTP ${response.status}). ` +
                        "Check the backend URL and deployment logs."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        result.detail || `Upload failed (HTTP ${response.status}).`
                    );
                }

                status.textContent =
                    "Upload successful!\n" +
                    "University email: " + result.email + "\n" +
                    "S3 bucket: " + result.s3_bucket + "\n" +
                    "S3 key: " + result.s3_key;

                form.reset();

            } catch (error) {
                status.textContent =
                    "Error: " + error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
